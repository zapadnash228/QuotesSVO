<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenQuotes - Цитаты известных личностей</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMzAiIGZpbGw9IiM2MzY2ZjEiLz48cGF0aCBkPSJNMjAgMjhxLTQtOCAwLTEydDggMGwtMiAxMnptMTggMHEtNC04IDAtMTJ0OCAwbC0yIDEyeiIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Заголовок -->
        <div class="header">
            <h1 class="title">💭 ZenQuotes</h1>
            <p class="subtitle">Мудрость великих людей</p>
        </div>

        <!-- Карточка с цитатой -->
        <div class="card">
            <!-- Начальное сообщение -->
            <div id="initial-message" class="initial-message">
                <p>Нажмите на кнопку, чтобы получить вдохновляющую цитату</p>
            </div>

            <!-- Индикатор загрузки -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Загрузка мудрости...</p>
            </div>

            <!-- Сообщение об ошибке -->
            <div id="error" class="error hidden">
                <p id="error-message"></p>
            </div>

            <!-- Контент цитаты -->
            <div id="quote-content" class="quote-content hidden">
                <!-- Переведенная цитата -->
                <div class="quote-main">
                    <div class="quote-mark-open">"</div>
                    <p id="translated-quote" class="quote-text"></p>
                    <div class="quote-mark-close">"</div>
                </div>

                <!-- Оригинальная цитата -->
                <div class="original-quote">
                    <p id="original-quote"></p>
                </div>

                <!-- Автор -->
                <div class="author-info">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span id="author" class="author-name"></span>
                </div>

                <!-- Год -->
                <div class="info-block">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <div>
                        <p class="info-label">Период:</p>
                        <p id="year" class="info-text"></p>
                    </div>
                </div>

                <!-- Контекст -->
                <div class="info-block">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg>
                    <div>
                        <p class="info-label">Контекст:</p>
                        <p id="purpose" class="info-text"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопка -->
        <div class="button-container">
            <button id="fetch-quote-btn" class="fetch-button">
                <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                <span id="button-text">Получить новую цитату</span>
            </button>
        </div>

        <!-- Футер -->
        <div class="footer">
            <p>Powered by ZenQuotes API & Claude AI</p>
        </div>
    </div>

    <!-- React библиотеки -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
